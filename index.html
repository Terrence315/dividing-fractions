<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dividing Fractions — Practice Quiz</title><style>body{font:17px system-ui,sans-serif;max-width:780px;margin:28px auto;padding:0 18px;background:#f3f7fb;color:#18314c}h1{color:#174d80}main,.card{background:white;border:1px solid #d7e2ef;border-radius:14px;padding:20px;margin:14px 0}button{font:inherit;cursor:pointer;border-radius:9px;padding:11px 15px;border:1px solid #9fb6cd;background:white;margin:5px 0;text-align:left}button.choice{display:block;width:100%}button:disabled{cursor:default}button.correct{background:#ddf6e6;border-color:#2c8b58}button.wrong{background:#ffe3e1;border-color:#b94444}.actions{background:#175b91;color:white;border:0}.small{color:#52677b;font-size:14px}#feedback{font-weight:600;margin-top:12px}#progress{font-weight:600} </style></head><body><main><h1>Dividing Fractions</h1><p>Mathematics 700 Fundamentals · Unit 2</p><p>Keep the first number, change division to multiplication, and flip the second number. Simplify your answer.</p><p class="small">Questions and answer positions shuffle on every new attempt. Feedback and explanations appear immediately. Works offline.</p><button class="actions" onclick="start()">Start / New attempt</button><p id="progress"></p></main><section id="quiz" class="card" hidden><h2 id="question"></h2><div id="choices"></div><div id="feedback" aria-live="polite"></div><button id="next" class="actions" onclick="nextQuestion()" hidden>Next question</button></section><section id="end" class="card" hidden></section><script>const bank=[{"n": 1, "a": "3/4", "b": "2/5", "answer": "A", "options": ["1 7/8", "3/10", "8/15", "2"], "correct": "1 7/8", "work": "3/4 \u00f7 2/5 = 3/4 \u00d7 5/2 = 15/8 = 1 7/8"}, {"n": 2, "a": "5/6", "b": "1/3", "answer": "D", "options": ["5/18", "2/5", "3", "2 1/2"], "correct": "2 1/2", "work": "5/6 \u00f7 1/3 = 5/6 \u00d7 3/1 = 15/6 = 2 1/2"}, {"n": 3, "a": "2/3", "b": "4/9", "answer": "A", "options": ["1 1/2", "8/27", "2/3", "2"], "correct": "1 1/2", "work": "2/3 \u00f7 4/9 = 2/3 \u00d7 9/4 = 18/12 = 1 1/2"}, {"n": 4, "a": "7/8", "b": "1/4", "answer": "B", "options": ["7/32", "3 1/2", "2/7", "4"], "correct": "3 1/2", "work": "7/8 \u00f7 1/4 = 7/8 \u00d7 4/1 = 28/8 = 3 1/2"}, {"n": 5, "a": "3/5", "b": "9/10", "answer": "B", "options": ["27/50", "2/3", "1 1/2", "1"], "correct": "2/3", "work": "3/5 \u00f7 9/10 = 3/5 \u00d7 10/9 = 30/45 = 2/3"}, {"n": 6, "a": "4/7", "b": "2/3", "answer": "D", "options": ["8/21", "1 1/6", "1", "6/7"], "correct": "6/7", "work": "4/7 \u00f7 2/3 = 4/7 \u00d7 3/2 = 12/14 = 6/7"}, {"n": 7, "a": "5/12", "b": "5/6", "answer": "B", "options": ["25/72", "1/2", "2", "1"], "correct": "1/2", "work": "5/12 \u00f7 5/6 = 5/12 \u00d7 6/5 = 30/60 = 1/2"}, {"n": 8, "a": "9/10", "b": "3/5", "answer": "A", "options": ["1 1/2", "27/50", "2/3", "2"], "correct": "1 1/2", "work": "9/10 \u00f7 3/5 = 9/10 \u00d7 5/3 = 45/30 = 1 1/2"}, {"n": 9, "a": "1/2", "b": "3", "answer": "B", "options": ["1 1/2", "1/6", "6", "1/3"], "correct": "1/6", "work": "1/2 \u00f7 3 = 1/2 \u00d7 1/3 = 1/6 = 1/6"}, {"n": 10, "a": "7/9", "b": "2", "answer": "C", "options": ["1 5/9", "2 4/7", "7/18", "4/9"], "correct": "7/18", "work": "7/9 \u00f7 2 = 7/9 \u00d7 1/2 = 7/18 = 7/18"}, {"n": 11, "a": "3", "b": "3/4", "answer": "A", "options": ["4", "2 1/4", "1/4", "4 1/2"], "correct": "4", "work": "3 \u00f7 3/4 = 3/1 \u00d7 4/3 = 12/3 = 4"}, {"n": 12, "a": "6", "b": "2/5", "answer": "B", "options": ["2 2/5", "15", "1/15", "15 1/2"], "correct": "15", "work": "6 \u00f7 2/5 = 6/1 \u00d7 5/2 = 30/2 = 15"}, {"n": 13, "a": "1 3/4", "b": "1/2", "answer": "C", "options": ["7/8", "2/7", "3 1/2", "4"], "correct": "3 1/2", "work": "1 3/4 \u00f7 1/2 = 7/4 \u00d7 2/1 = 14/4 = 3 1/2"}, {"n": 14, "a": "2 1/4", "b": "1 1/2", "answer": "D", "options": ["3 3/8", "2/3", "2", "1 1/2"], "correct": "1 1/2", "work": "2 1/4 \u00f7 1 1/2 = 9/4 \u00d7 2/3 = 18/12 = 1 1/2"}, {"n": 15, "a": "2 1/2", "b": "1 1/4", "answer": "C", "options": ["3 1/8", "1/2", "2", "2 1/2"], "correct": "2", "work": "2 1/2 \u00f7 1 1/4 = 5/2 \u00d7 4/5 = 20/10 = 2"}, {"n": 16, "a": "2 1/3", "b": "2/3", "answer": "A", "options": ["3 1/2", "1 5/9", "2/7", "4"], "correct": "3 1/2", "work": "2 1/3 \u00f7 2/3 = 7/3 \u00d7 3/2 = 21/6 = 3 1/2"}, {"n": 17, "a": "2 3/4", "b": "1 1/2", "answer": "C", "options": ["4 1/8", "6/11", "1 5/6", "2"], "correct": "1 5/6", "work": "2 3/4 \u00f7 1 1/2 = 11/4 \u00d7 2/3 = 22/12 = 1 5/6"}, {"n": 18, "a": "2 1/6", "b": "1 2/3", "answer": "A", "options": ["1 3/10", "3 11/18", "10/13", "1 2/5"], "correct": "1 3/10", "work": "2 1/6 \u00f7 1 2/3 = 13/6 \u00d7 3/5 = 39/30 = 1 3/10"}, {"n": 19, "a": "1 1/2", "b": "2 1/4", "answer": "D", "options": ["3 3/8", "1 1/2", "1", "2/3"], "correct": "2/3", "work": "1 1/2 \u00f7 2 1/4 = 3/2 \u00d7 4/9 = 12/18 = 2/3"}, {"n": 20, "a": "4 1/4", "b": "2 1/2", "answer": "D", "options": ["10 5/8", "10/17", "1 4/5", "1 7/10"], "correct": "1 7/10", "work": "4 1/4 \u00f7 2 1/2 = 17/4 \u00d7 2/5 = 34/20 = 1 7/10"}, {"n": 21, "a": "2/5", "b": "4", "answer": "C", "options": ["1 3/5", "10", "1/10", "1/5"], "correct": "1/10", "work": "2/5 \u00f7 4 = 2/5 \u00d7 1/4 = 2/20 = 1/10"}, {"n": 22, "a": "8", "b": "1 1/3", "answer": "C", "options": ["10 2/3", "1/6", "6", "6 1/2"], "correct": "6", "work": "8 \u00f7 1 1/3 = 8/1 \u00d7 3/4 = 24/4 = 6"}, {"n": 23, "a": "1 5/6", "b": "2/3", "answer": "D", "options": ["1 2/9", "4/11", "3", "2 3/4"], "correct": "2 3/4", "work": "1 5/6 \u00f7 2/3 = 11/6 \u00d7 3/2 = 33/12 = 2 3/4"}, {"n": 24, "a": "3 3/4", "b": "5/6", "answer": "B", "options": ["3 1/8", "4 1/2", "2/9", "5"], "correct": "4 1/2", "work": "3 3/4 \u00f7 5/6 = 15/4 \u00d7 6/5 = 90/20 = 4 1/2"}];let set=[],at=0,score=0,answered=false;function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){set=shuffle(bank.map(q=>({...q,opts:shuffle(q.options.map((v,i)=>({value:v,correct:'ABCD'[i]===q.answer})))})));at=0;score=0;document.getElementById('end').hidden=true;show()}function show(){answered=false;let q=set[at];document.getElementById('quiz').hidden=false;document.getElementById('progress').textContent=`Question ${at+1} of ${set.length} · Score: ${score}`;document.getElementById('question').textContent=`${q.a} ÷ ${q.b} = ?`;document.getElementById('feedback').textContent='';document.getElementById('next').hidden=true;let root=document.getElementById('choices');root.innerHTML='';q.opts.forEach((o,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=`${'ABCD'[i]}. ${o.value}`;b.onclick=()=>answer(i);root.appendChild(b)})}function answer(i){if(answered)return;answered=true;let q=set[at];let buttons=[...document.querySelectorAll('.choice')];q.opts.forEach((o,j)=>{buttons[j].disabled=true;if(o.correct)buttons[j].classList.add('correct');else if(j===i)buttons[j].classList.add('wrong')});if(q.opts[i].correct)score++;document.getElementById('feedback').textContent=(q.opts[i].correct?'Correct! ':'Not quite. ')+q.work;document.getElementById('progress').textContent=`Question ${at+1} of ${set.length} · Score: ${score}`;document.getElementById('next').hidden=false;document.getElementById('next').textContent=at===set.length-1?'See results':'Next question'}function nextQuestion(){at++;if(at<set.length)show();else{document.getElementById('quiz').hidden=true;let e=document.getElementById('end');e.hidden=false;e.innerHTML=`<h2>Quiz complete</h2><p>You scored <strong>${score} / ${set.length}</strong> (${Math.round(score/set.length*100)}%).</p><p>Click “Start / New attempt” to try again with reshuffled questions and answers.</p>`;document.getElementById('progress').textContent='Finished'}}start();</script></body></html>
